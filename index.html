<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест устройств</title>
  <style>
    /* По умолчанию (для компьютера) экран красный */
    body {
      margin: 0;
      height: 100vh;
      background-color: red;
    }

    /* Если ширина экрана меньше 768px (телефон), делаем синим */
    @media (max-width: 768px) {
      body {
        background-color: blue;
      }
    }
  </style>
</head>
<body>
</body>
</html>
